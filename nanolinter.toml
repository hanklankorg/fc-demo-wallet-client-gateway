# The lint plan of the pull request gate: Forge CI runs `nanolinter verify`
# against it. The checks are the ones `just lint-all` runs, with the SAST
# and dependency scans the pull request gate ran before.
# `nanolinter explain --all` lists more checks.

[detect]
auto = true

[verify]
checks = [
  "version-control",
  "commits",
  "secrets",
  "sast",
  "osv",
  "yaml",
  "markdown",
  "shell",
  "shell-format",
  "actions",
  "license",
  "xml",
  "container",
  "java-checkstyle",
  "java-pmd",
  "java-spotbugs",
  "java-format",
]

[policy]
block = [
  "version-control",
  "commits",
  "secrets",
  "sast",
  "osv",
  "yaml",
  "markdown",
  "shell",
  "shell-format",
  "actions",
  "license",
  "xml",
  "container",
  "java-checkstyle",
  "java-pmd",
  "java-spotbugs",
  "java-format",
]

# renovate.json sets no minimum release age for some update groups. That is
# a choice about how Renovate proposes updates, not a defect in the code, so
# the rule is left out here for the maintainers to decide.
[linters.sast.settings]
"opengrep.exclude_rules" = [
  "package_managers.renovate.renovate-missing-minimum-release-age.renovate-missing-minimum-release-age",
]
